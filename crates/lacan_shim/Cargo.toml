[package]
name = "lacan_shim"
version = "7.0.0"
edition = "2021"
description = "Rust helpers for Lacan Scan (walk, regex, escapes). Called from Crisp via extern rust."
license = "Apache-2.0"
repository = "https://github.com/jose-compu/lacan-scan"
homepage = "https://jose-compu.github.io/lacan-scan/"
documentation = "https://docs.rs/lacan_shim"
readme = "README.md"
keywords = ["security", "ai", "scanner", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1"
walkdir = "2"
serde_json = "1"
minijinja = { version = "2", features = ["fuel"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
