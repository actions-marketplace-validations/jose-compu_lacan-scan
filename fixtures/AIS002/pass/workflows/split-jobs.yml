name: split
on: pull_request_target
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.title }}"
  model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: openai/chatgpt-action@v1
        with:
          prompt: safe static prompt
