name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Crisp
        run: cargo install crisp-lang --locked --version 1.11.0
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Emit + release build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          crisp emit .
          cargo build --release --manifest-path target/rust/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="lacan-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/rust/target/${{ matrix.target }}/release" lacan
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lacan-${{ matrix.target }}.tar.gz
            lacan-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # Keep floating major tags (v1, v2, …) for `uses: jose-compu/lacan-scan@v1`.
      - name: Update major version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "skip major tag update for non-semver tag: $tag"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          git fetch origin "$tag"
          git tag -f "$major" "$tag"
          git push -f origin "refs/tags/${major}"
          echo "pointed ${major} -> ${tag}"
