name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  crisp:
    name: crisp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Crisp 1.11 needs rustc >= 1.88 (let-chains in crisp-parser).
      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-crisp-1.11.0-${{ hashFiles('**/Cargo.toml', 'crisp.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crisp-1.11.0-

      - name: Install Crisp 1.11.0
        run: |
          set -euo pipefail
          if ! command -v crisp >/dev/null 2>&1 || ! crisp --version | grep -q '1\.11\.0'; then
            cargo install crisp-lang --locked --version 1.11.0 --force
          fi
          crisp --version

      - name: crisp check
        run: |
          set -euo pipefail
          echo "== crisp check =="
          crisp check .

      - name: crisp test
        shell: bash
        run: |
          set -euo pipefail
          echo "== crisp test =="
          # Crisp prints the summary on stderr; merge streams for the log file.
          crisp test . 2>&1 | tee /tmp/crisp-test.out
          exit "${PIPESTATUS[0]}"

      - name: lacan_shim cargo test
        run: |
          set -euo pipefail
          echo "== cargo test -p lacan_shim =="
          cargo test --manifest-path crates/lacan_shim/Cargo.toml -- --nocapture

      - name: crisp build
        run: |
          set -euo pipefail
          echo "== crisp build =="
          crisp build . 2>&1 | tee /tmp/crisp-build.out
          # Crisp codegen noise is silenced in .cargo/config.toml; keep builds clean.
          warn_count="$(grep -c '^warning:' /tmp/crisp-build.out || true)"
          echo "rustc warning lines: ${warn_count}"
          test "$warn_count" -eq 0
          test -x target/rust/target/debug/lacan
          ./target/rust/target/debug/lacan --version | grep -F 'lacan 3.0.3'

      - name: e2e
        run: |
          set -euo pipefail
          chmod +x scripts/e2e.sh
          ./scripts/e2e.sh
